# Builds the Prowl Android app and publishes it as the "apk-latest" GitHub release, which the website's
# "Download APK" button links to (https://github.com/satyaorz/prawl/releases/latest/download/prowl.apk).
#
# The app must be signed with the SAME key the wallet website vouches for (apps/wallet/public/.well-known/assetlinks.json):
# otherwise Android refuses the website's passkeys inside the app. The build makes a throwaway debug key when none is
# supplied, so this workflow REFUSES to run without the key (secret ANDROID_DEBUG_KEYSTORE_B64) and checks the finished
# APK's certificate before publishing anything.
#
# One-time setup (a person with admin rights on the repo):
#   base64 -w0 offline/app/keystore/prawl-debug.keystore | gh secret set ANDROID_DEBUG_KEYSTORE_B64
# Then run the workflow from the Actions tab ("Run workflow"), or push a change under offline/app.
name: Android APK

on:
  push:
    branches: [dev]
    paths: ["offline/app/**"]
  workflow_dispatch:

permissions:
  contents: write # to publish the release

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  # The website the app's Wallet tab loads.
  PRAWL_SITE: https://prawl-wallet.centralindia.cloudapp.azure.com
  # SHA-256 of the signing certificate listed in assetlinks.json (a public fingerprint, not a secret).
  EXPECTED_CERT_SHA256: e6e0daae1031f70e5a267a383878ac564a935106f75600310feda6bf1ea92eaf

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the signing key from the repository secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The secret ANDROID_DEBUG_KEYSTORE_B64 is not set. Refusing to build with a throwaway key: an APK signed by it cannot use the website's passkeys. See the setup note at the top of this workflow."
            exit 1
          fi
          mkdir -p offline/app/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > offline/app/keystore/prawl-debug.keystore

      - name: Build the APK
        working-directory: offline/app
        run: ./gradlew :app:assemblePrawlDebug -Pprawl.site="$PRAWL_SITE"

      - name: Check it is signed with the expected certificate
        run: |
          APK=offline/app/app/build/outputs/apk/prawl/debug/app-prawl-debug.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          echo "APK certificate:      $GOT"
          echo "Expected certificate: $EXPECTED_CERT_SHA256"
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::The APK is not signed with the key the website vouches for."; exit 1; }
          cp "$APK" prowl.apk
          sha256sum prowl.apk

      - name: Publish the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest prowl.apk \
            --target "$GITHUB_SHA" \
            --title "Prowl Android app (built from ${GITHUB_SHA::7})" \
            --notes "Built by CI from commit $GITHUB_SHA. Loads $PRAWL_SITE. Debug-signed with the project's test key: test networks only. Install it on Android 12 or newer."
