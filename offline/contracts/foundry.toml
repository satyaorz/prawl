[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "osaka"          # P256VERIFY (EIP-7951) and EIP-7883 MODEXP pricing are Osaka/Fusaka features
optimizer = true
optimizer_runs = 200
via_ir = false
gas_limit = 9223372036854775807  # test-runner cap only (the parser cross-check test holds a 560 KB JSON in memory); the 2^24 per-tx cap (EIP-7825) is checked explicitly in tests
fs_permissions = [{ access = "read", path = "./fixtures" }]
remappings = ["forge-std/=lib/forge-std/src/", "nitro/=lib/nitro-validator/src/", "solarity/=lib/solarity/"]

[profile.prague]
evm_version = "prague"         # used only to compare MODEXP / P-384 costs before EIP-7883

[lint]
lint_on_build = false
